name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend（lint / validate / test / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ees_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ees_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/ees_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 動態生成測試用 secret（避免高熵字串寫死在 repo 觸發 gitleaks）
      - name: Generate test JWT secret
        run: echo "JWT_SECRET=ci-$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate & generate
        run: npx prisma validate && npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Migrate test database
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npx jest --config test/jest-e2e.json --runInBand

      - name: Build
        run: npm run build

  docs:
    name: Docs（OpenAPI lint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Redocly lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml

  analyzer:
    name: Analyzer（pytest 契約測試）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest（stub 引擎，不需 Ollama/模型下載）
        run: python -m pytest -q

  security-audit:
    name: Security（npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit（生產依賴，high 以上即失敗；dev 鏈交由 dependabot 追蹤）
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
