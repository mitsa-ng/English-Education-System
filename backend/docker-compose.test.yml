# 僅供 e2e 測試用：獨立 port（5433）與一次性 volume
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: ees_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ees_test"]
      interval: 2s
      timeout: 3s
      retries: 15
