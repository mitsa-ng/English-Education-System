name: english-education-system

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ees
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ees"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio-server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  analyzer:
    build: ./analyzer
    environment:
      ANALYZER_INTERNAL_TOKEN: ${ANALYZER_INTERNAL_TOKEN:?ANALYZER_INTERNAL_TOKEN is required}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3}
    # 不發佈對外埠：僅 backend 經內部網路呼叫（架構文件 §8.4）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; req=urllib.request.Request('http://localhost:8000/internal/health', headers={'X-Internal-Token': os.environ['ANALYZER_INTERNAL_TOKEN']}); urllib.request.urlopen(req, timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama
    volumes:
      - ollamadata:/root/.ollama
    # 不發佈對外埠；若用外部 Ollama，移除此服務並設 OLLAMA_URL

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/ees
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SERVER_NAME: ${SERVER_NAME:-我的英語教室}
      TEACHER_NAME: ${TEACHER_NAME:-}
      SCHOOL: ${SCHOOL:-}
      SERVER_DESCRIPTION: ${SERVER_DESCRIPTION:-}
      SOFTWARE_VERSION: ${SOFTWARE_VERSION:-0.1.0}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ees-attachments}
      ANALYZER_URL: http://analyzer:8000
      ANALYZER_INTERNAL_TOKEN: ${ANALYZER_INTERNAL_TOKEN:?ANALYZER_INTERNAL_TOKEN is required}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  pgdata:
  miniodata:
  ollamadata:
