name: english-education-system

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ees
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ees"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/ees
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SERVER_NAME: ${SERVER_NAME:-我的英語教室}
      TEACHER_NAME: ${TEACHER_NAME:-}
      SCHOOL: ${SCHOOL:-}
      SERVER_DESCRIPTION: ${SERVER_DESCRIPTION:-}
      SOFTWARE_VERSION: ${SOFTWARE_VERSION:-0.1.0}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  pgdata:
